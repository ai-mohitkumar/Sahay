name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies & Sync Capacitor
        working-directory: ./frontend
        run: |
          npm install
          npm run build:android

      - name: Grant Execute Permission to Gradlew
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Output
        run: |
          mkdir -p release-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release-output/Sahay-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahay-Android-APK
          path: release-output/Sahay-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release with Downloadable APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-apk
          name: "Sahay Mobile App v1.0.0 (Android APK)"
          body: |
            ## 🚀 Sahay — The AI Schedule Negotiator (Android APK Release)

            ### 📱 Download & Install on Android Phone:
            1. Download the attached **`Sahay-v1.0.0.apk`** file below directly to your phone.
            2. Tap the downloaded file and select **Install** (Allow "Install from unknown sources" if prompted).
            3. Enjoy full native standalone experience with circadian sleep sync and cognitive schedule bargaining!

            ### ✨ Key Features:
            - **24h Circadian Flow**: Dynamically adjusts to college hours and sleep rhythm.
            - **Trade-Off Negotiator**: Bargains trade-offs when energy dips.
            - **Capacity Reality Check**: Protects against 13h over-planning.
            - **Confession Mode**: Zero-judgment weekly self-awareness logger.
          files: release-output/Sahay-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
